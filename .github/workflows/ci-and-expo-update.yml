name: CI and Expo Update

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ github.event_name == 'pull_request' && 'Verify pull request' || 'Verify merged commit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_I_AM_TRAVELLER: ${{ secrets.EXPO_PUBLIC_I_AM_TRAVELLER }}
      PLACES_DATA: ${{ secrets.PLACES_DATA }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Guard native runtime version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-native-runtime-version.js "$BASE_SHA"

      - name: Check bundle configuration
        run: |
          test -n "$EXPO_PUBLIC_I_AM_TRAVELLER"
          test -n "$PLACES_DATA"

      - name: Create production bundles
        run: npx expo export --platform all --output-dir /tmp/expo-export

  update:
    name: Publish production EAS Update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      EXPO_PUBLIC_I_AM_TRAVELLER: ${{ secrets.EXPO_PUBLIC_I_AM_TRAVELLER }}
      PLACES_DATA: ${{ secrets.PLACES_DATA }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check production configuration
        run: |
          test -n "$EXPO_PUBLIC_I_AM_TRAVELLER"
          test -n "$PLACES_DATA"

      - name: Publish production update
        run: >-
          eas update
          --channel production
          --message "${{ github.event.head_commit.message }}"
          --non-interactive
